<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: Die App darf bis unter die Notch / Dynamic Island gehen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Winter Arc</title>
  <meta name="description" content="Dein Habit Tracker für den Winter Arc.">

  <!-- Farben für Browser-Leiste & Dark Mode -->
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <!-- iPhone: Als App vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Winter Arc">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">

  <!-- type="module" = moderne JavaScript-Module (import/export) -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Hier rendert JavaScript die aktuelle Ansicht rein -->
  <main id="app" class="app"></main>

  <!-- Die schwebende Tab-Bar unten -->
  <nav id="tabbar" class="tabbar" aria-label="Navigation" hidden></nav>

  <noscript>
    <p style="padding:24px;color:#fff;font-family:system-ui">Winter Arc braucht JavaScript. Bitte aktiviere es in deinem Browser.</p>
  </noscript>
</body>
</html>
